name: Code Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Unified quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mms
          POSTGRES_USER: mms
          POSTGRES_PASSWORD: mms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mms -d mms"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MMS_DATABASE_URL: postgresql://mms:mms@127.0.0.1:5432/mms
      MMS_TEST_DATABASE_URL: postgresql://mms:mms@127.0.0.1:5432/mms
      MMS_SERVICE_TOKEN: dev-token
      DEEPEVAL_TELEMETRY_OPT_OUT: YES
      DEEPEVAL_CACHE_FOLDER: /tmp/mms-deepeval-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize database
        run: python scripts/init_db.py

      - name: Resolve diff base
        id: diff-base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          fi

      - name: Run quality gate
        run: |
          python scripts/quality_gate.py \
            --profile ci \
            --require-new-code-coverage \
            --skip gitleaks \
            --diff-base "${{ steps.diff-base.outputs.ref }}"

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ github.run_id }}
          path: quality/reports
          retention-days: 90
          if-no-files-found: ignore

  dependency-audit-prod:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Audit production dependency set
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pip-audit
          pip-audit --progress-spinner off --vulnerability-service osv

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
