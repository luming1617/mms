name: LLM Offline Evaluation

# Full offline model-quality evaluation (docs/1-模型质量评测体系设计.md §7).
# PR/push quality gates already run the deterministic core set through the
# llm-evaluation stage in quality-gate.yml; this workflow runs the complete
# suite, including the public benchmarks (LongMemEval/LoCoMo, opted in via
# MMS_EVAL_INCLUDE_PUBLIC_BENCHMARK=1), with an LLM judge when credentials are
# available:
#   - MMS_EVAL_JUDGE_MODEL (repo variable): judge model id for DeepEval metrics
#   - provider credentials (e.g. OPENAI_API_KEY secret): judge model access
# Without a judge the run still executes all deterministic contracts and
# reports that semantic scoring was skipped (stage WARN, non-blocking).
# When a judge is configured, the judge-calibration job re-checks it against
# the human-labelled sample set and fails the run when the error budgets
# (false-pass <=5%, false-fail <=20%) are exceeded.

"on":
  schedule:
    # 02:30 Asia/Shanghai (18:30 UTC)
    - cron: "30 18 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deepeval:
    name: DeepEval golden datasets
    runs-on: ubuntu-latest
    # public-benchmark replay writes thousands of turns per question; the
    # deterministic core set finishes in minutes, the full suite needs longer
    timeout-minutes: 120
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mms
          POSTGRES_USER: mms
          POSTGRES_PASSWORD: mms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mms -d mms"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MMS_DATABASE_URL: postgresql://mms:mms@127.0.0.1:5432/mms
      MMS_TEST_DATABASE_URL: postgresql://mms:mms@127.0.0.1:5432/mms
      MMS_SERVICE_TOKEN: dev-token
      MMS_EVAL_JUDGE_MODEL: ${{ vars.MMS_EVAL_JUDGE_MODEL }}
      MMS_EVAL_INCLUDE_PUBLIC_BENCHMARK: "1"
      DEEPEVAL_TELEMETRY_OPT_OUT: YES
      DEEPEVAL_CACHE_FOLDER: /tmp/mms-deepeval-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize database
        run: python scripts/init_db.py

      - name: Run offline evaluation stage
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/quality_gate.py \
            --profile ci \
            --only baseline,llm-evaluation \
            --skip gitleaks

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-evaluation-report-${{ github.run_id }}
          path: |
            quality/reports/eval-results.json
            quality/reports/eval-history.ndjson
            quality/reports/junit-evaluation.xml
            quality/reports/benchmark-*.json
            quality/reports/benchmark-*.jsonl
          retention-days: 180
          if-no-files-found: ignore

  judge-calibration:
    name: Judge calibration
    # calibration needs a real judge model; without one the evaluation job
    # already reports semantic scoring as WARN, so this job is skipped
    if: ${{ vars.MMS_EVAL_JUDGE_MODEL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MMS_EVAL_JUDGE_MODEL: ${{ vars.MMS_EVAL_JUDGE_MODEL }}
      DEEPEVAL_TELEMETRY_OPT_OUT: YES
      DEEPEVAL_CACHE_FOLDER: /tmp/mms-deepeval-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run judge calibration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python evals/calibration/run_calibration.py

      - name: Upload calibration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-calibration-${{ github.run_id }}
          path: quality/reports/judge-calibration.json
          retention-days: 180
          if-no-files-found: ignore
