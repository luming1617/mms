global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/slo-rules.yml
  - /etc/prometheus/rules/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: mms-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: mms-embedding-worker
    static_configs:
      - targets: ["worker:9101"]
  - job_name: mms-ingestion-worker
    static_configs:
      - targets: ["ingestion:9102"]
  - job_name: mms-outbox-worker
    static_configs:
      - targets: ["outbox:9103"]
  - job_name: mms-lifecycle-worker
    static_configs:
      - targets: ["lifecycle:9104"]
  - job_name: mms-translation-worker
    static_configs:
      - targets: ["translation:9105"]
  - job_name: mms-view-cost-worker
    static_configs:
      - targets: ["view-cost:9106"]
  - job_name: mms-otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]
  - job_name: mms-otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]
